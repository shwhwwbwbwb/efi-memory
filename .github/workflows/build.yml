name: Build EFI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install gnu-efi
        run: |
          sudo apt update
          sudo apt install -y gnu-efi build-essential

      - name: Compile driver
        run: |
          cd driver
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-efi
          path: driver/memory.efi
